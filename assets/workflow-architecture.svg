<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">AI Competitive Content Response Agent architecture</title>
  <desc id="desc">A workflow moves from operator inputs through citation and sentiment analysis to a threshold gate. A low signal produces a no-action note, while a qualifying signal produces research, content, and sales enablement drafts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .eyebrow{font:700 15px ui-sans-serif,system-ui;letter-spacing:2.4px;fill:#67e8f9}
      .heading{font:750 38px ui-sans-serif,system-ui;fill:#f8fafc}
      .sub{font:400 18px ui-sans-serif,system-ui;fill:#bdd2e6}
      .label{font:700 17px ui-sans-serif,system-ui;fill:#eaf6ff}
      .copy{font:400 14px ui-sans-serif,system-ui;fill:#b9cee0}
      .step{font:700 13px ui-sans-serif,system-ui;fill:#071425}
      .branch{font:800 14px ui-sans-serif,system-ui;letter-spacing:1px}
      .line{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="840" rx="32" fill="url(#bg)"/>
  <circle cx="1260" cy="90" r="190" fill="#0ea5e9" opacity=".08"/>
  <circle cx="70" cy="810" r="260" fill="#22d3ee" opacity=".05"/>

  <text x="80" y="82" class="eyebrow">PROFOUND WORKFLOW · PUBLIC-SAFE ARCHITECTURE</text>
  <text x="80" y="132" class="heading">Signal first. Production only when it matters.</text>
  <text x="80" y="170" class="sub">Citation traction and positive validation must both clear the operator's thresholds.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="230" width="250" height="124" rx="18" fill="#12324a" stroke="#2f5874"/>
    <circle cx="112" cy="262" r="16" fill="url(#accent)"/>
    <text x="106" y="267" class="step">1</text>
    <text x="140" y="268" class="label">Operator inputs</text>
    <text x="108" y="305" class="copy">Competitor · topic · prompt</text>
    <text x="108" y="329" class="copy">thresholds · optional URL</text>

    <rect x="405" y="230" width="250" height="124" rx="18" fill="#12324a" stroke="#2f5874"/>
    <circle cx="437" cy="262" r="16" fill="url(#accent)"/>
    <text x="431" y="267" class="step">2</text>
    <text x="465" y="268" class="label">Citation signal</text>
    <text x="433" y="305" class="copy">Top five pages · seven days</text>
    <text x="433" y="329" class="copy">aggregate repeated URL records</text>

    <rect x="730" y="230" width="250" height="124" rx="18" fill="#12324a" stroke="#2f5874"/>
    <circle cx="762" cy="262" r="16" fill="url(#accent)"/>
    <text x="756" y="267" class="step">3</text>
    <text x="790" y="268" class="label">Claim validation</text>
    <text x="758" y="305" class="copy">Positive and negative claims</text>
    <text x="758" y="329" class="copy">for the selected page</text>

    <path d="M 1090 292 L 1160 230 L 1230 292 L 1160 354 Z" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
    <text x="1114" y="287" class="label">Both signals</text>
    <text x="1123" y="313" class="copy">clear threshold?</text>
  </g>

  <path d="M330 292 H395" class="line"/>
  <path d="M655 292 H720" class="line"/>
  <path d="M980 292 H1080" class="line"/>

  <path d="M1160 354 V448 H1040" class="line"/>
  <path d="M1230 292 H1300 V588 H1190" class="line"/>
  <text x="1058" y="431" class="branch" fill="#86efac">YES</text>
  <text x="1264" y="475" class="branch" fill="#fcd34d">NO</text>

  <g filter="url(#shadow)">
    <rect x="105" y="465" width="935" height="250" rx="24" fill="#0b2538" stroke="#22d3ee" stroke-width="2"/>
    <rect x="105" y="465" width="12" height="250" rx="6" fill="url(#accent)"/>
    <text x="150" y="510" class="eyebrow">QUALIFYING SIGNAL · RESPONSE PACKAGE</text>

    <rect x="150" y="548" width="190" height="112" rx="16" fill="#133b53"/>
    <text x="174" y="581" class="label">Evidence gap</text>
    <text x="174" y="611" class="copy">Claims, citation appeal,</text>
    <text x="174" y="633" class="copy">and missing proof</text>

    <rect x="365" y="548" width="190" height="112" rx="16" fill="#133b53"/>
    <text x="389" y="581" class="label">Research</text>
    <text x="389" y="611" class="copy">Independent sources</text>
    <text x="389" y="633" class="copy">and linkable findings</text>

    <rect x="580" y="548" width="190" height="112" rx="16" fill="#133b53"/>
    <text x="604" y="581" class="label">Content</text>
    <text x="604" y="611" class="copy">Brief + human-reviewed</text>
    <text x="604" y="633" class="copy">article draft</text>

    <rect x="795" y="548" width="200" height="112" rx="16" fill="#133b53"/>
    <text x="819" y="581" class="label">Enablement</text>
    <text x="819" y="611" class="copy">Call points + three</text>
    <text x="819" y="633" class="copy">email snippets</text>

    <rect x="1090" y="525" width="220" height="128" rx="20" fill="#3b2f13" stroke="#fbbf24"/>
    <text x="1120" y="566" class="eyebrow" fill="#fcd34d">LOW SIGNAL</text>
    <text x="1120" y="602" class="label">No-action note</text>
    <text x="1120" y="627" class="copy">Decision recorded;</text>
    <text x="1120" y="647" class="copy">no content generated</text>
  </g>

  <rect x="80" y="762" width="1240" height="2" fill="#2b506a"/>
  <text x="80" y="802" class="copy">DRAFT OUTPUTS ONLY</text>
  <text x="1210" y="802" text-anchor="end" class="copy">Human review before publication or outreach</text>
</svg>
